# Publishes site/ on GitHub Pages at every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pubblica il sito

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Regenerate the ride pages so prices in their structured data always
      # match site/store.json.
      - run: python scripts/site/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
