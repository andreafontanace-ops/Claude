[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-sov"
version = "0.1.0"
description = "Crawler e calcolo della share of voice sui risultati di ricerca Amazon.it"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
amazon-sov = "amazon_sov.cli:main"

[tool.setuptools]
packages = ["amazon_sov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
