{% extends "base.html" %}
{% block title %}Accedi{% endblock %}
{% block content %}
<div class="narrow">
<h1>Accedi</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="form" method="post" action="/accedi">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Email <input type="email" name="email" required autocomplete="email"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">Accedi</button>
  <p class="muted"><a href="/password-dimenticata">Password dimenticata?</a></p>
  <p class="muted">Non hai un account? <a href="/registrati">Prova gratis</a></p>
</form>
</div>
{% endblock %}
